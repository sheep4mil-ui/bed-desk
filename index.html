<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#11110f">
  <title>Bed Desk</title>
  <style>
    :root { color-scheme: dark; --ink:#f4f0e8; --muted:#918d84; --line:#302f2b; --lime:#c9ff55; --panel:#1a1a17; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; min-height:100%; background:#11110f; color:var(--ink); font-family:Inter,system-ui,sans-serif; overscroll-behavior:none; }
    body { min-height:100dvh; padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom); display:flex; justify-content:center; }
    main { width:min(100%,620px); display:grid; grid-template-rows:auto auto 1fr auto; gap:12px; min-height:100dvh; padding:12px 0; }
    header { display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; gap:10px; align-items:center; font-weight:800; letter-spacing:-.03em; }
    .dot { width:10px; height:10px; background:var(--lime); border-radius:50%; box-shadow:0 0 16px var(--lime); }
    button,input,textarea { font:inherit; }
    button { color:var(--ink); border:1px solid var(--line); background:var(--panel); border-radius:14px; min-height:48px; font-weight:650; touch-action:manipulation; }
    button:active { transform:scale(.97); background:#292923; }
    .stop { min-height:36px; padding:0 12px; color:#ff8a80; background:transparent; }
    .header-actions { display:flex; gap:7px; }
    .screen-toggle { min-height:36px; padding:0 12px; color:var(--lime); background:transparent; }
    .screen { position:relative; min-height:150px; max-height:38dvh; aspect-ratio:16/9; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:#050505; }
    .screen img,.screen video { width:100%; height:100%; display:block; object-fit:contain; pointer-events:none; }
    .screen-state { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:.82rem; pointer-events:none; }
    .screen img[src] + .screen-state { display:none; }
    .screen-tools { position:absolute; top:10px; right:10px; display:flex; gap:7px; z-index:2; }
    .screen-tools button { min-height:38px; padding:0 12px; background:#11110fcc; backdrop-filter:blur(10px); }
    .keyboard-capture { display:none; position:absolute; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:3; height:48px; padding:0 14px; border:1px solid var(--lime); border-radius:12px; background:#171713ee; color:var(--ink); font-size:16px; }
    .screen.fullscreen { position:fixed; inset:0; z-index:20; width:100vw; height:100dvh; max-height:none; aspect-ratio:auto; border:0; border-radius:0; touch-action:none; }
    .screen.fullscreen .keyboard-capture { display:block; }
    .screen.fullscreen .screen-state { font-size:1rem; }
    .remote-cursor { position:absolute; left:0; top:0; z-index:4; width:7px; height:9px; background:var(--lime); clip-path:polygon(0 0,8% 82%,34% 61%,58% 100%,78% 86%,54% 51%,100% 47%); filter:drop-shadow(0 0 1px #000); pointer-events:none; transform:translate(-1px,-1px); }
    .pad { position:relative; min-height:42dvh; border:1px solid var(--line); border-radius:24px; overflow:hidden; touch-action:none;
      background:radial-gradient(circle at 50% 35%,#25251f 0,#181815 55%,#151512 100%); }
    .pad::before { content:"MOVE"; position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(2rem,10vw,4rem); font-weight:900; color:#262620; letter-spacing:.08em; pointer-events:none; }
    .hint { position:absolute; bottom:18px; width:100%; text-align:center; color:var(--muted); font-size:.78rem; pointer-events:none; }
    .clicks,.keys,.shortcuts { display:grid; gap:8px; }
    .clicks { grid-template-columns:1fr 1fr; }
    .keys { grid-template-columns:repeat(5,1fr); }
    .shortcuts { grid-template-columns:repeat(4,1fr); }
    .left { background:var(--lime); color:#14150f; border-color:var(--lime); }
    .typebox { display:grid; grid-template-columns:1fr auto; gap:8px; }
    textarea { resize:none; height:54px; padding:15px; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:14px; outline:none; }
    textarea:focus { border-color:#777467; }
    .send { padding:0 18px; }
    .status { min-height:20px; text-align:center; color:var(--muted); font-size:.78rem; }
    .login { position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:24px; background:#11110f; }
    .card { width:min(100%,360px); text-align:center; }
    .card h1 { font-size:2.5rem; margin:0 0 8px; letter-spacing:-.06em; }
    .card p { color:var(--muted); line-height:1.5; }
    .pin { width:100%; padding:16px; text-align:center; letter-spacing:.3em; font-size:1.4rem; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:14px; outline:none; }
    .connect { width:100%; margin-top:10px; background:var(--lime); color:#14150f; border-color:var(--lime); }
    .hidden { display:none; }
    @media (max-height:700px) { .pad { min-height:32dvh; } main { gap:8px; } button { min-height:42px; } }
  </style>
</head>
<body>
  <section class="login" id="login">
    <div class="card">
      <div class="dot" style="margin:0 auto 20px"></div>
      <h1>Bed Desk</h1>
      <p id="loginHelp">Enter the code shown on your PC.</p>
      <input class="pin" id="server" type="url" inputmode="url" placeholder="https://…trycloudflare.com/…" style="font-size:.9rem;letter-spacing:0;text-align:left;margin-bottom:10px">
      <input class="pin" id="pin" inputmode="text" maxlength="9" placeholder="ABCD EFGH" autocomplete="one-time-code">
      <button class="connect" id="connect">Connect</button>
      <p id="loginError"></p>
    </div>
  </section>

  <main>
    <header><div class="brand"><i class="dot"></i> BED DESK</div><div class="header-actions"><button class="screen-toggle hidden" id="soundButton">Sound</button><button class="screen-toggle" id="screenToggle">Screen on</button><button class="stop" id="stop">Stop</button></div></header>
    <div class="screen" id="screen"><video class="hidden" id="screenVideo" autoplay muted playsinline></video><img id="screenView" alt="Live view of the PC screen"><div class="screen-state">Loading PC screen…</div><i class="remote-cursor" id="remoteCursor"></i><div class="screen-tools"><button id="keyboardButton">Keyboard</button><button id="fullscreenButton">Full screen</button></div><input class="keyboard-capture" id="keyboardCapture" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Type on your PC…"></div>
    <div class="pad" id="pad"><div class="hint">Tap to click · two fingers to scroll</div></div>
    <div>
      <div class="clicks"><button class="left" data-click="left">Left click</button><button data-click="right">Right click</button></div>
      <div class="typebox" style="margin-top:8px"><textarea id="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Type something…"></textarea><button class="send" id="send">Send</button></div>
      <div class="keys" style="margin-top:8px">
        <button data-key="backspace">⌫</button><button data-key="enter">Enter</button><button data-key="tab">Tab</button><button data-key="left">←</button><button data-key="right">→</button>
      </div>
      <div class="shortcuts" style="margin-top:8px">
        <button data-hotkey="copy">Copy</button><button data-hotkey="paste">Paste</button><button data-hotkey="undo">Undo</button><button data-hotkey="save">Save</button>
      </div>
      <div class="status" id="status">Connected over local Wi-Fi</div>
    </div>
  </main>
  <audio id="pcAudio" autoplay playsinline></audio>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script>
    const hosted = location.hostname.endsWith('github.io');
    const fragment = new URLSearchParams(location.hash.slice(1));
    const hostMode = hosted && fragment.has('host');
    let pin = sessionStorage.getItem('bedDeskPin') || '';
    let server = hosted ? (sessionStorage.getItem('bedDeskServer') || '') : '';
    const $ = s => document.querySelector(s);
    const login = $('#login'), status = $('#status');
    let pairingPeer=null,pcAudioCall=null;
    if (!hosted) {
      $('#server').classList.add('hidden');
      $('#loginHelp').textContent = 'Enter the PIN shown on your PC.';
      $('#pin').inputMode = 'numeric';
      $('#pin').maxLength = 6;
      $('#pin').placeholder = '••••••';
    } else {
      $('#server').classList.add('hidden');
    }
    async function action(data, quiet=false) {
      try {
        const endpoint = hosted ? `${server}api/action` : 'api/action';
        const r = await fetch(endpoint, {method:'POST', headers:{'Content-Type':'application/json','X-Remote-Pin':pin}, body:JSON.stringify(data)});
        if (r.status === 401) { login.classList.remove('hidden'); sessionStorage.removeItem('bedDeskPin'); throw Error('Wrong PIN'); }
        if (!r.ok && r.status !== 204) throw Error('Connection lost');
        return true;
      } catch(e) { if(!quiet) status.textContent=e.message; return false; }
    }
    function remoteUrl(path) { return hosted ? `${server}${path}` : path; }
    let screenRunning=false,liveVideo=false,screenTimer=null,screenObjectUrl='',cursorX=.5,cursorY=.5,pcWidth=1920,pcHeight=1080;
    function renderCursor(){
      const image=liveVideo?$('#screenVideo'):$('#screenView'),box=$('#screen'),marker=$('#remoteCursor'),rect=box.getBoundingClientRect();
      const mediaWidth=liveVideo?image.videoWidth:image.naturalWidth,mediaHeight=liveVideo?image.videoHeight:image.naturalHeight;
      const imageRatio=(mediaWidth&&mediaHeight)?mediaWidth/mediaHeight:16/9;
      const boxRatio=rect.width/rect.height;let width,height,left,top;
      if(boxRatio>imageRatio){height=rect.height;width=height*imageRatio;left=(rect.width-width)/2;top=0;}
      else{width=rect.width;height=width/imageRatio;left=0;top=(rect.height-height)/2;}
      marker.style.left=`${left+(cursorX/pcWidth)*width}px`;marker.style.top=`${top+(cursorY/pcHeight)*height}px`;
    }
    async function refreshScreen() {
      if(!screenRunning||liveVideo)return;
      try {
        const response=await fetch(remoteUrl('screen.jpg'),{headers:{'X-Remote-Pin':pin},cache:'no-store'});
        if(!response.ok)throw new Error('Screen unavailable');
        cursorX=Number(response.headers.get('X-Cursor-X'))||cursorX;cursorY=Number(response.headers.get('X-Cursor-Y'))||cursorY;
        pcWidth=Number(response.headers.get('X-Screen-Width'))||pcWidth;pcHeight=Number(response.headers.get('X-Screen-Height'))||pcHeight;
        const nextUrl=URL.createObjectURL(await response.blob());
        const oldUrl=screenObjectUrl; screenObjectUrl=nextUrl; $('#screenView').src=nextUrl;
        renderCursor();
        if(oldUrl)URL.revokeObjectURL(oldUrl);
      } catch(error) { status.textContent=error.message; }
      if(screenRunning)screenTimer=setTimeout(refreshScreen,250);
    }
    function startScreen(){if(screenRunning)return;screenRunning=true;$('#screen').classList.remove('hidden');$('#screenToggle').textContent='Screen on';if(!liveVideo)refreshScreen();}
    function stopScreen(){screenRunning=false;clearTimeout(screenTimer);$('#screen').classList.add('hidden');$('#screenToggle').textContent='Screen off';if(screenObjectUrl){URL.revokeObjectURL(screenObjectUrl);screenObjectUrl='';}$('#screenView').removeAttribute('src');}
    async function focusedControlAcceptsText(){
      try{const response=await fetch(remoteUrl('focus'),{headers:{'X-Remote-Pin':pin},cache:'no-store'});return response.ok&&(await response.json()).text===true;}catch{return false;}
    }
    function showPhoneKeyboard(){const input=$('#keyboardCapture');input.focus({preventScroll:true});input.click();}
    function toggleFullscreen(){
      const active=$('#screen').classList.toggle('fullscreen');
      $('#fullscreenButton').textContent=active?'Exit':'Full screen';
      document.body.style.overflow=active?'hidden':'';
    }
    async function connect() {
      if (hosted) {
        const code = $('#pin').value.replace(/[^a-z0-9]/gi,'').toLowerCase();
        if (code.length !== 8) { $('#loginError').textContent='Enter all eight characters.'; return; }
        $('#loginError').textContent='Finding your PC…';
        try {
          const pairing = await getPairing(code);
          server = pairing.server;
          pin = pairing.pin;
        } catch (error) {
          $('#loginError').textContent=error.message;
          return;
        }
      } else {
        pin = $('#pin').value.trim();
        if (!/^\d{6}$/.test(pin)) { $('#loginError').textContent='Enter all six digits.'; return; }
      }
      if (await action({type:'move',dx:0,dy:0},true)) {
        sessionStorage.setItem('bedDeskPin',pin);
        if (hosted) sessionStorage.setItem('bedDeskServer',server);
        login.classList.add('hidden');
        startScreen();
      }
      else $('#loginError').textContent='That PIN did not work.';
    }
    $('#connect').onclick=connect; $('#pin').onkeydown=e=>{if(e.key==='Enter')connect()};
    if (!hosted && /^\d{6}$/.test(pin)) login.classList.add('hidden');

    function getPairing(code) {
      return new Promise((resolve,reject) => {
        const peer = new Peer();
        pairingPeer=peer;
        const timer = setTimeout(()=>{ peer.destroy(); reject(new Error('PC not found. Check the code and keep its setup tab open.')); },12000);
        peer.on('call',call=>{
          if(pcAudioCall)pcAudioCall.close();pcAudioCall=call;call.answer();
          call.on('stream',stream=>{
            const audio=$('#pcAudio'),video=$('#screenVideo'),videoTracks=stream.getVideoTracks(),audioTracks=stream.getAudioTracks();
            if(audioTracks.length){audio.srcObject=new MediaStream(audioTracks);audio.muted=false;$('#soundButton').classList.remove('hidden');audio.play().catch(()=>{$('#soundButton').textContent='Play sound';});}
            if(videoTracks.length){
              liveVideo=true;screenRunning=true;clearTimeout(screenTimer);video.srcObject=new MediaStream(videoTracks);video.classList.remove('hidden');$('#screenView').classList.add('hidden');$('#screen').classList.remove('hidden');video.play().catch(()=>{});status.textContent='Live video connected';
              videoTracks[0].addEventListener('ended',()=>{liveVideo=false;video.srcObject=null;video.classList.add('hidden');$('#screenView').classList.remove('hidden');if(screenRunning)refreshScreen();});
            }
          });
        });
        peer.on('open',()=>{
          const connection=peer.connect(`bed-${code}`,{reliable:true});
          connection.on('data',data=>{
            if(data?.server && data?.pin){
              clearTimeout(timer); resolve(data);
            }
          });
          connection.on('error',()=>{});
        });
        peer.on('error',()=>{ clearTimeout(timer); peer.destroy(); reject(new Error('PC not found. Check the code and try again.')); });
      });
    }

    if (hostMode) {
      const code = fragment.get('host').toLowerCase();
      const hostServer = fragment.get('server');
      const hostPin = fragment.get('pin');
      history.replaceState(null,'',location.pathname);
      $('.card').innerHTML='<div class="dot" style="margin:0 auto 20px"></div><h1>PC ready</h1><p>On your phone, open this same website and enter:</p><div class="pin" style="font-weight:800">'+code.toUpperCase().replace(/(.{4})/,'$1 ')+'</div><button class="connect" id="enablePcSound">Enable smooth video + sound</button><p id="hostStatus">Registering this PC…</p>';
      const hostPeer = new Peer(`bed-${code}`);
      let sharedDisplayStream=null,hostCapture=null,lastPhonePeer='';
      function broadcastDisplay(peerId){if(sharedDisplayStream&&peerId)hostPeer.call(peerId,sharedDisplayStream);}
      async function startCapture(){
        const button=$('#enablePcSound');button.disabled=true;$('#hostStatus').textContent='Choose a screen and enable Share system audio…';
        try{
          hostCapture=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:30,max:30}},audio:true});
          sharedDisplayStream=hostCapture;button.textContent='Smooth video enabled';$('#hostStatus').textContent='Ready — live video and sound will play on the phone';broadcastDisplay(lastPhonePeer);
        }catch(error){button.disabled=false;$('#hostStatus').textContent=error.message||'Automatic streaming could not start.';}
      }
      hostPeer.on('open',()=>{ $('#hostStatus').textContent='Ready — keep this window open'; });
      hostPeer.on('connection',connection=>connection.on('open',()=>{lastPhonePeer=connection.peer;connection.send({server:hostServer,pin:hostPin});broadcastDisplay(lastPhonePeer);}));
      hostPeer.on('error',()=>$('#hostStatus').textContent='Could not register. Restart cellular mode.');
      $('#enablePcSound').onclick=startCapture;
    }
    document.querySelectorAll('[data-click]').forEach(b=>b.onclick=()=>action({type:'click',button:b.dataset.click}));
    document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>action({type:'key',key:b.dataset.key}));
    document.querySelectorAll('[data-hotkey]').forEach(b=>b.onclick=()=>action({type:'hotkey',key:b.dataset.hotkey}));
    $('#send').onclick=()=>{const t=$('#text'); if(t.value){action({type:'text',text:t.value});t.value='';}};
    $('#text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#send').click();}};
    $('#stop').onclick=async()=>{if(confirm('Stop Bed Desk on the PC?')){await action({type:'stop'});status.textContent='Stopped';}};
    $('#screenToggle').onclick=()=>screenRunning?stopScreen():startScreen();
    $('#soundButton').onclick=async()=>{const audio=$('#pcAudio');audio.muted=false;try{await audio.play();$('#soundButton').textContent='Sound on';}catch{status.textContent='Tap Sound again to allow audio';}};
    $('#fullscreenButton').onclick=e=>{e.stopPropagation();toggleFullscreen();};
    $('#keyboardButton').onclick=e=>{e.stopPropagation();showPhoneKeyboard();};
    $('#keyboardCapture').addEventListener('beforeinput',e=>{
      if(e.inputType==='deleteContentBackward'){e.preventDefault();action({type:'key',key:'backspace'},true);}
      if(e.inputType==='insertLineBreak'){e.preventDefault();action({type:'key',key:'enter'},true);}
    });
    $('#keyboardCapture').addEventListener('input',e=>{if(e.target.value){action({type:'text',text:e.target.value},true);e.target.value='';}});
    $('#keyboardCapture').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();action({type:'key',key:'enter'},true);}});

    const pad=$('#pad'),screenSurface=$('#screen'); let touches=new Map(), moved=0, lastMove=0;
    let queuedX=0,queuedY=0,queuedScroll=0,motionSending=false;
    function queueMotion(dx,dy,scroll=0){
      queuedX+=dx;queuedY+=dy;queuedScroll+=scroll;
      if(dx||dy){cursorX=Math.max(0,Math.min(pcWidth,cursorX+dx));cursorY=Math.max(0,Math.min(pcHeight,cursorY+dy));renderCursor();}
      flushMotion();
    }
    async function flushMotion(){
      if(motionSending)return;motionSending=true;
      while(queuedX||queuedY||queuedScroll){
        const dx=Math.round(queuedX),dy=Math.round(queuedY),scroll=Math.round(queuedScroll);queuedX=queuedY=queuedScroll=0;
        if(dx||dy)await action({type:'move',dx,dy},true);if(scroll)await action({type:'scroll',amount:scroll},true);
      }
      motionSending=false;
    }
    function bindPointerSurface(surface){
    surface.addEventListener('pointerdown',e=>{if(surface===screenSurface&&!screenSurface.classList.contains('fullscreen'))return;if(e.target.closest('button,input'))return;surface.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY});moved=0;});
    surface.addEventListener('pointermove',e=>{
      const t=touches.get(e.pointerId); if(!t)return;
      t.x=e.clientX;t.y=e.clientY; moved+=Math.abs(t.x-t.px)+Math.abs(t.y-t.py);
      const now=performance.now();
      if(now-lastMove>16){
        const all=[...touches.values()];
        if(all.length===1){queueMotion(Math.round((t.x-t.px)*1.7),Math.round((t.y-t.py)*1.7));}
        else {queueMotion(0,0,Math.round(-(t.y-t.py)*12));}
        all.forEach(v=>{v.px=v.x;v.py=v.y});lastMove=now;
      }
    });
    async function end(e){const wasTracked=touches.has(e.pointerId);touches.delete(e.pointerId);if(wasTracked&&moved<8&&touches.size===0){action({type:'click',button:'left'},true);if(surface===screenSurface){setTimeout(async()=>{if(await focusedControlAcceptsText())showPhoneKeyboard();},180);}}}
    surface.addEventListener('pointerup',end);surface.addEventListener('pointercancel',end);
    surface.addEventListener('contextmenu',e=>e.preventDefault());
    }
    bindPointerSurface(pad);bindPointerSurface(screenSurface);
  </script>
</body>
</html>
